<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiled Verandah</title>
<meta name="description" content="Tiled Verandah — a little space to slow down. Original AI-assisted music and small animated stories.">
<style>
  :root { --bg: #E6D7BD; --ink: #493F38; --accent: #C77E62; --soft: #66745D; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font-family: Georgia, "Times New Roman", serif; padding: 24px 16px; }
  main { max-width: 560px; text-align: center; }
  h1 { font-size: clamp(2rem, 6vw, 3rem); font-weight: normal; letter-spacing: 0.02em; margin: 0 0 8px; }
  .tag { font-style: italic; color: var(--soft); margin: 0 0 32px; font-size: 1.15rem; }
  p { line-height: 1.6; }
  footer { margin-top: 40px; font-family: system-ui, sans-serif; font-size: 0.9rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Tiled Verandah</h1>
  <p class="tag">A little space to slow down.</p>
  <p>Original, AI-assisted music, dreamy animated moments and visual escapes for quiet mornings, rainy afternoons, late-night thoughts, reading, working and unwinding.</p>
  <footer><a href="privacy.html">Privacy policy</a></footer>
</main>
</body>
</html>
